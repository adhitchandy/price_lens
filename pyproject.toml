[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price_lens"
version = "1.0.0"
description = "Price research for consumer products across Amazon, eBay, Zalando and MediaMarkt"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "seaborn>=0.13",
  "selenium>=4.18",
  "streamlit>=1.52",  # components v2 (custom screens)
  "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
price_lens = "price_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"price_lens.webapp" = ["static/*", "static/js/*", "static/js/views/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
